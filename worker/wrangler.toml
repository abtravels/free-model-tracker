name = "free-model-tracker"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Runs every 15 minutes, exactly on the clock (unlike GitHub's best-effort cron).
[triggers]
crons = ["*/15 * * * *"]

# Seen-model state lives here so we never re-announce the same model.
[[kv_namespaces]]
binding = "STATE"
id = "d0e4584d143f4d3f87d21dfee4cb395c"

[observability]
enabled = true
